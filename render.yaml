# Render Blueprint for sub2api.
#
# Deploys the single Docker image (Go backend + embedded frontend) as one free
# web service. PostgreSQL and Redis are NOT provisioned here: they live on an
# existing external provider (Aiven) and are injected as connection strings.
#
# Variables marked `sync: false` are secrets: Render prompts for them in the
# dashboard and never stores them in this file.
#
# See deploy/RENDER.md for the full step-by-step guide.

services:
  - type: web
    name: sub2api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # External PostgreSQL (Aiven) connection string; format documented in
      # deploy/RENDER.md. No credential value is stored in this file.
      - key: DATABASE_URL
        sync: false
      # External Redis / Valkey (Aiven) connection string; TLS scheme required.
      - key: REDIS_URL
        sync: false
      # Initial administrator account, used only on the first boot when the
      # database has no admin yet. ADMIN_PASSWORD has no safe default: when it
      # is empty the application generates a random password and prints it once
      # in the deploy log, after which it cannot be recovered - so set it here.
      - key: ADMIN_EMAIL
        value: admin@sub2api.local
      - key: ADMIN_PASSWORD
        sync: false
      # Builds config.yaml and the first admin from the variables above.
      - key: AUTO_SETUP
        value: "true"
      # Timezone for logs and scheduling.
      - key: TZ
        value: UTC
      # External Postgres plans (Aiven free tier) allow only a couple of dozen
      # connections in total, while the application default is a pool of 256
      # (max_open_conns) plus 128 idle. Without this cap the pool is exhausted
      # immediately and background jobs fail with
      # "pq: sorry, too many clients already".
      - key: DATABASE_MAX_OPEN_CONNS
        value: "8"
      - key: DATABASE_MAX_IDLE_CONNS
        value: "2"
